<script>
// Club Ibiza Tickets -- GTM/GA4 event tracking layer
window.dataLayer = window.dataLayer || [];

function citAmbassadorCode(){
  try {
    var a = window.CIT && CIT.readAttribution();
    return a ? a.code : undefined;
  } catch(e) { return undefined; }
}

function citFireEvent(name, params){
  params = params || {};
  var code = citAmbassadorCode();
  if (code) params.ambassador_code = code;
  dataLayer.push(Object.assign({event: name}, params));
  if (window.gtag) gtag('event', name, params);
}

document.addEventListener('click', function(e){
  var link = e.target.closest('a');
  if (link && link.href) {
    var href = link.href;
    if (href.indexOf('clubtickets.com') !== -1) {
      citFireEvent('buy_tickets_click', {link_url:href, link_text:(link.textContent||'').trim()});
    } else if (href.indexOf('wa.me') !== -1) {
      citFireEvent('contact_click', {contact_method:'whatsapp', link_url:href});
    } else if (href.indexOf('clubibizatickets.com') === -1 && href.indexOf('mailto:') === -1 && href.charAt(0) !== '#') {
      try {
        citFireEvent('outbound_click', {link_url:href, link_domain:new URL(href).hostname});
      } catch(err) {}
    }
  }
  var btn = e.target.closest('button');
  if (btn) {
    var t = (btn.textContent||'').trim();
    if (t.indexOf('Send via WhatsApp') !== -1 || t.indexOf('Send by email') !== -1) {
      citFireEvent('vip_table_request', {method: t.indexOf('WhatsApp') !== -1 ? 'whatsapp' : 'email'});
    } else if (t.indexOf('Buy Drink Package') !== -1) {
      citFireEvent('drink_package_click', {});
    }
  }
});
// Ready hook for future checkout/purchase events:
// citFireEvent('purchase', {transaction_id:'...', value:..., currency:'EUR'});
</script>
