<script>
// Club Ibiza Tickets -- GTM event tracking layer
window.dataLayer = window.dataLayer || [];

document.addEventListener('click', function(e){
  var link = e.target.closest('a');
  if (link && link.href) {
    var href = link.href;
    if (href.indexOf('clubtickets.com') !== -1) {
      dataLayer.push({event:'buy_tickets_click', link_url:href, link_text:(link.textContent||'').trim()});
    } else if (href.indexOf('wa.me') !== -1) {
      dataLayer.push({event:'contact_click', contact_method:'whatsapp', link_url:href});
    } else if (href.indexOf('clubibizatickets.com') === -1 && href.indexOf('mailto:') === -1 && href.charAt(0) !== '#') {
      try {
        dataLayer.push({event:'outbound_click', link_url:href, link_domain:new URL(href).hostname});
      } catch(err) {}
    }
  }
  var btn = e.target.closest('button');
  if (btn) {
    var t = (btn.textContent||'').trim();
    if (t.indexOf('Send via WhatsApp') !== -1 || t.indexOf('Send by email') !== -1) {
      dataLayer.push({event:'vip_table_request', method: t.indexOf('WhatsApp') !== -1 ? 'whatsapp' : 'email'});
    } else if (t.indexOf('Buy Drink Package') !== -1) {
      dataLayer.push({event:'drink_package_click'});
    }
  }
});
// Ready hook for future checkout/purchase events:
// dataLayer.push({event:'purchase', transaction_id:'...', value:..., currency:'EUR', items:[...]});
</script>
